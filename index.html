<style>
:root{--ink:#202b27;--muted:#707b75;--paper:#f5f4ef;--card:#fffefa;--line:#e5e5dc;--green:#285c49;--mint:#e4eee7;--orange:#e89658;--shadow:0 14px 40px #25372d0b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:15px}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:22px 24px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;width:42px;height:42px;background:var(--green);color:white;border-radius:14px;font-size:21px}.brand strong{font-size:17px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:11px;font-weight:650}.btn:hover{border-color:#a8b9ae}.btn.primary{background:var(--green);border-color:var(--green);color:white}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--green);font-weight:750}.hero h1{font-size:clamp(27px,5vw,40px);line-height:1.2;letter-spacing:-.04em;margin:8px 0}.hero p{color:var(--muted);margin:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);padding:21px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.panel-head h2{font-size:18px;margin:0}.hint{font-size:12px;color:var(--muted)}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;color:#59665f;margin-bottom:6px}.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:11px 12px;outline:none;color:var(--ink)}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#80a490;box-shadow:0 0 0 3px #285c4910}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.page{display:none}.page.active{display:block}.projects-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.project-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}.project-top{display:flex;justify-content:space-between;gap:12px}.project-name{font-size:17px;font-weight:750}.subtle{font-size:12px;color:var(--muted);margin-top:4px}.project-details{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.tag{font-size:11px;padding:5px 8px;border-radius:7px;background:#f2f3ee;color:#5f6c64}.units{border-top:1px solid #f0f0eb;padding-top:11px}.units-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.units-head strong{font-size:12px}.unit-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #f4f3ee}.unit-row:first-of-type{border-top:0}.unit-name{font-weight:650;font-size:13px}.unit-meta{font-size:11px;color:var(--muted);margin-top:3px}.text-btn{border:0;background:none;color:var(--green);font-size:12px;padding:6px}.danger{color:#b94d42}.rating-layout{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);gap:16px;align-items:start}.score-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score-field{border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.score-field label{display:block;font-size:12px;color:#59665f;font-weight:700;margin-bottom:7px}.score-field select{width:100%;border:0;background:transparent;color:var(--green);font-weight:750;font-size:15px;outline:none}.unit-summary{background:var(--mint);border-radius:12px;padding:13px;margin:0 0 14px;font-size:13px}.unit-summary b{font-size:15px}.score-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}.score-total strong{font-size:23px;color:var(--green)}.rating-history{margin-top:16px}.visit-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;margin-bottom:9px}.visit-head{display:flex;justify-content:space-between;gap:10px}.visit-title{font-weight:750}.visit-score{font-weight:800;color:var(--green);white-space:nowrap}.visit-meta{font-size:11px;color:var(--muted);margin-top:4px}.visit-notes{font-size:12px;line-height:1.6;margin-top:9px;color:#526057}.comparison{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:720px;background:#fff;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #efefe9;font-size:12px}th{color:#59665f;background:#f5f6f1;font-weight:750}td b{font-size:14px}td.score{color:var(--green);font-weight:800;font-size:15px}.empty{padding:42px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.actions-inline{display:flex;gap:6px;align-items:center}.search{max-width:250px}.toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,15px);background:#263d33;color:white;padding:11px 16px;border-radius:11px;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.foot{text-align:center;font-size:11px;color:#89928c;margin:20px 0 0}.bottom-nav{display:none}
@media(max-width:760px){.desktop-nav{display:none}.wrap{padding:15px 13px 90px}.top{margin-bottom:22px}.brand small{display:none}.actions{gap:5px}.actions .btn{padding:8px 9px;font-size:11px}.hero{display:block}.hero p{font-size:13px}.projects-grid,.rating-layout{grid-template-columns:1fr}.panel{padding:16px}.bottom-nav{position:fixed;z-index:15;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#fffefa;border-top:1px solid var(--line);box-shadow:0 -5px 20px #233c2e0c}.nav-btn{border:0;background:none;color:#7b857e;font-size:11px;padding:5px 2px;display:grid;justify-items:center;gap:3px}.nav-btn .nav-icon{font-size:19px;line-height:1}.nav-btn.active{color:var(--green);font-weight:750}.foot{margin-bottom:6px}.comparison{margin:0 -5px}.row{gap:8px}}
.score-stars{display:flex;gap:3px}.score-stars button{border:0;background:none;padding:0 2px;color:#d3d5cc;font-size:21px;line-height:1}.score-stars button.on{color:#e3a33d}.score-help{font-size:10px;color:var(--muted);line-height:1.45;min-height:29px;margin-top:6px}.compare-switch{display:flex;gap:6px;margin:0 0 14px}.compare-switch .btn{padding:8px 12px;font-size:12px}.compare-switch .btn.selected{background:var(--green);color:#fff;border-color:var(--green)}.radar-wrap{overflow:auto;text-align:center;background:#fff;border-radius:13px;padding:10px}.radar-wrap svg{width:min(100%,680px);height:auto;min-width:390px}.radar-legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:11px;color:#58655e;margin:8px auto}.legend-item{display:flex;align-items:center;gap:5px}.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.desktop-nav{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:-5px 0 21px}.nav-tab{border:0;background:transparent;color:var(--muted);padding:12px 15px;margin-bottom:-1px;border-bottom:2px solid transparent;font-weight:700}.nav-tab span{margin-right:7px}.nav-tab.active{color:var(--green);border-color:var(--green)}.unit-price-summary{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:10px}.unit-price-summary span{font-size:12px;color:#546258}.unit-price-summary strong{color:var(--green);font-size:14px}</style></head>
<body><main class="wrap"><header class="top"><div class="brand"><div class="logo">⌂</div><div><strong>看房筆記</strong><small>建案・評分・比較</small></div></div><div class="actions"><button class="btn" id="importBtn">匯入</button><button class="btn" id="csvBtn">匯出 CSV</button><button class="btn" id="jsonBtn">備份</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<section class="hero"><div><div class="eyebrow">YOUR HOME JOURNAL</div><h1 id="heroTitle">建案資料</h1><p id="heroDesc">先整理建案資訊，再在同一建案下建立看房戶別。</p></div></section>
<nav class="desktop-nav" aria-label="主要功能"><button class="nav-tab active" data-page="projects"><span>⌂</span>建案資料</button><button class="nav-tab" data-page="rating"><span>✎</span>看房評分</button><button class="nav-tab" data-page="compare"><span>▥</span>總覽比較</button></nav>
<section class="page active" id="page-projects"><div class="rating-layout"><div class="panel"><div class="panel-head"><h2 id="projectFormTitle">新增建案</h2><span class="hint">基本資料</span></div><form id="projectForm"><input type="hidden" id="projectEdit"><div class="field"><label>建案名稱 ＊</label><input id="pName" required placeholder="例如：青禾之森"></div><div class="field"><label>地址／區域</label><input id="pAddress" placeholder="台北市大安區⋯"></div><div class="row"><div class="field"><label>建商</label><input id="pBuilder" placeholder="建商名稱"></div><div class="field"><label>聯絡方式</label><input id="pContact" placeholder="電話／仲介"></div></div><div class="field"><label>建案備註</label><textarea id="pNotes" placeholder="交通、周邊、管理等建案資訊"></textarea></div><div class="actions-inline"><button class="btn primary" type="submit" id="projectSave">新增建案</button><button class="btn" type="button" id="projectCancel" hidden>取消</button></div></form></div><div><div class="panel-head"><h2>建案清單</h2><span class="hint" id="projectCount">0 個建案</span></div><div class="projects-grid" id="projects"></div><div class="empty" id="projectsEmpty"><b>還沒有建案</b>使用左側表單新增第一個建案。</div></div></div></section>
<section class="page" id="page-rating"><div class="rating-layout"><div class="panel"><div class="panel-head"><h2>選擇看房戶別</h2></div><div class="field"><label>建案</label><select id="rProject"><option value="">請先選擇建案</option></select></div><div class="field"><label>戶別</label><select id="rUnit" disabled><option value="">請選擇戶別</option></select></div><div id="selectedSummary" class="unit-summary" hidden></div><div class="hint">新增或管理戶別，請到「建案資料」分頁。</div></div><div class="panel"><div class="panel-head"><h2>看房評分與現場紀錄</h2><span class="hint">每項 1–5 分</span></div><form id="visitForm"><input type="hidden" id="visitEdit"><div class="row"><div class="field"><label>看房日期 ＊</label><input type="date" id="vDate" required></div><div class="field"><label>現場總價／租金</label><input id="vPrice" placeholder="例如：1,680 萬"></div></div><div class="score-fields" id="scoreFields"></div><div class="score-total"><span>本次總分（各項平均）</span><strong id="scoreAverage">—</strong></div><div class="row" style="margin-top:14px"><div class="field"><label>喜歡的地方</label><textarea id="vPros" placeholder="採光、景觀、環境⋯"></textarea></div><div class="field"><label>需要考慮</label><textarea id="vCons" placeholder="噪音、收納、交通⋯"></textarea></div></div><div class="field"><label>現場紀錄／待確認</label><textarea id="vNotes" placeholder="仲介說明、需要追問的事、現場觀察⋯"></textarea></div><button class="btn primary" type="submit" id="visitSave">儲存看房紀錄</button><button class="btn" type="button" id="visitCancel" hidden>取消編輯</button></form></div></div><div class="rating-history"><div class="panel-head"><h2>該戶看房紀錄</h2><span class="hint" id="historyCount"></span></div><div id="history"></div></div></section>
<section class="page" id="page-compare"><div class="panel"><div class="panel-head"><div><h2>總覽比較</h2><div class="hint">比較所有已記錄評分的戶別</div></div><input class="search" id="compareSearch" placeholder="搜尋建案或戶別"></div><div class="compare-switch"><button class="btn selected" id="rankTab">總分排名</button><button class="btn" id="radarTab">雷達圖比較</button></div><div id="compareTable" class="comparison"></div><div id="radarView" hidden></div><div class="empty" id="compareEmpty"><b>還沒有可比較的評分</b>先到「看房評分」選擇戶別並留下紀錄。</div></div></section><p class="foot">資料儲存在目前這台裝置的瀏覽器中。可匯出 CSV 或定期備份 JSON。</p></main>
<nav class="bottom-nav"><button class="nav-btn active" data-page="projects"><span class="nav-icon">⌂</span>建案資料</button><button class="nav-btn" data-page="rating"><span class="nav-icon">✎</span>看房評分</button><button class="nav-btn" data-page="compare"><span class="nav-icon">▥</span>總覽比較</button></nav><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='home-journal-v2';const CATS=[['light','採光與通風','日照時間、通風、座向、西曬、室內明亮度'],['view','棟距與視野','前方棟距、遮蔽程度、景觀、隱私'],['noise','噪音與干擾','道路車流、鄰居聲音、施工、電梯及機械設備噪音'],['layout','格局與坪效','房間大小、動線、收納、衛浴數量、家具擺放、空間利用率'],['condition','屋況與裝潢','漏水、壁癌、管線、防水、裝潢品質、後續維修成本'],['parking','車位好停度','車位大小、位置、柱位、進出動線、會車難度'],['management','社區管理','管理品質、管理費、公共基金、垃圾處理、電梯及公設維護'],['value','價格性價比','開價、合理成交價、周邊行情、租金投報率、未來保值性']];let db={projects:[],visits:[]};let activePage='projects',compareMode='rank';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID();function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100)}function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(x.projects)&&Array.isArray(x.visits))db=x}catch{}const seeds=[['惠宇謙富','4F','1,898 萬','1,674 萬'],['惠宇謙富','11F','2,188 萬','1,888 萬'],['京祐雅正 YOUNG','8F','1,798 萬','1,579 萬'],['華相上謙','10F','1,798 萬','1,780 萬']];seeds.forEach(([name,floor,price,reference])=>{let p=db.projects.find(x=>x.name===name);if(!p){p={id:uid(),name,address:'',builder:'',contact:'',notes:'',units:[]};db.projects.push(p)}p.units=p.units||[];let u=p.units.find(x=>x.name===floor);if(!u)p.units.push({id:uid(),name:floor,layout:'',area:'',price,reference});else{u.price=u.price||price;u.reference=u.reference||reference}});localStorage.setItem(KEY,JSON.stringify(db))}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function project(id){return db.projects.find(p=>p.id===id)}function unit(pid,uid0){return project(pid)?.units.find(u=>u.id===uid0)}function average(v){const n=CATS.map(([k])=>+v.scores?.[k]||0).filter(x=>x>0);return n.length?n.reduce((a,b)=>a+b,0)/n.length:0}function stars(score){return score?'★'.repeat(Math.round(score))+'<span style="color:#d5d6cf">'+'★'.repeat(5-Math.round(score))+'</span>':'未評分'}
function renderProjects(){const host=$('projects');host.innerHTML=db.projects.map(p=>`<article class="project-card"><div class="project-top"><div><div class="project-name">${esc(p.name)}</div><div class="subtle">${esc(p.address||'地址未填寫')}${p.builder?' · '+esc(p.builder):''}</div></div><div class="actions-inline"><button class="text-btn" data-project-edit="${esc(p.id)}">編輯</button><button class="text-btn danger" data-project-delete="${esc(p.id)}">刪除</button></div></div>${p.contact||p.notes?`<div class="project-details">${p.contact?`<span class="tag">聯絡：${esc(p.contact)}</span>`:''}${p.notes?`<span class="tag">${esc(p.notes)}</span>`:''}</div>`:''}<div class="units"><div class="units-head"><strong>戶別（${p.units.length}）</strong><button class="text-btn" data-unit-add="${esc(p.id)}">＋ 新增戶別</button></div>${p.units.length?p.units.map(u=>`<div class="unit-row"><div><div class="unit-name">${esc(u.name)}</div><div class="unit-meta">${[u.layout,u.area,u.price&&('開價 '+u.price),u.reference&&('參考成交 '+u.reference)].filter(Boolean).map(esc).join(' · ')||'尚未填寫規格'}</div></div><div class="actions-inline"><button class="text-btn" data-unit-edit="${esc(p.id)}|${esc(u.id)}">編輯</button><button class="text-btn danger" data-unit-delete="${esc(p.id)}|${esc(u.id)}">刪除</button></div></div>`).join(''):'<div class="subtle">尚未建立戶別</div>'}</div></article>`).join('');$('projectsEmpty').style.display=db.projects.length?'none':'block';$('projectCount').textContent=`${db.projects.length} 個建案`;renderSelectors()}
function renderSelectors(){const prev=$('rProject').value;const options=db.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');$('rProject').innerHTML='<option value="">請選擇建案</option>'+options;if(project(prev))$('rProject').value=prev;renderUnits()}
function renderUnits(){const p=project($('rProject').value);const prev=$('rUnit').value;$('rUnit').innerHTML='<option value="">請選擇戶別</option>'+(p?p.units.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join(''):'');$('rUnit').disabled=!p||!p.units.length;if(p&&p.units.some(u=>u.id===prev))$('rUnit').value=prev;renderSelected()}
function renderSelected(){const p=project($('rProject').value),u=unit(p?.id,$('rUnit').value),box=$('selectedSummary');box.hidden=!u;if(u)box.innerHTML=`<b>${esc(p.name)}・${esc(u.name)}</b><div class="subtle">${esc(p.address||'')}</div><div class="unit-price-summary">${u.price?`<span>開價：<strong>${esc(u.price)}</strong></span>`:''}${u.reference?`<span>實登參考：<strong>${esc(u.reference)}</strong></span>`:''}${u.layout?`<span>格局：${esc(u.layout)}</span>`:''}${u.area?`<span>坪數：${esc(u.area)}</span>`:''}</div>`;renderHistory()}
function renderHistory(){const p=project($('rProject').value),u=unit(p?.id,$('rUnit').value);const visits=u?db.visits.filter(v=>v.unitId===u.id&&v.projectId===p.id).sort((a,b)=>b.date.localeCompare(a.date)):[];$('historyCount').textContent=u?`${visits.length} 筆紀錄`:'';$('history').innerHTML=visits.map(v=>`<article class="visit-card"><div class="visit-head"><div><div class="visit-title">${esc(v.date)} <span class="visit-score">${average(v).toFixed(1)} 分</span></div><div class="visit-meta">${v.price?'現場價格：'+esc(v.price):''} ${CATS.map(([k,label])=>v.scores?.[k]?`${label} ${v.scores[k]}`:'').filter(Boolean).join(' · ')}</div></div><div class="actions-inline"><button class="text-btn" data-visit-edit="${esc(v.id)}">編輯</button><button class="text-btn danger" data-visit-delete="${esc(v.id)}">刪除</button></div></div>${v.pros||v.cons||v.notes?`<div class="visit-notes">${v.pros?`<b>喜歡：</b>${esc(v.pros)} `:''}${v.cons?`<b>考慮：</b>${esc(v.cons)} `:''}${v.notes?`<b>現場：</b>${esc(v.notes)}`:''}</div>`:''}</article>`).join('')||'<div class="empty"><b>尚無看房紀錄</b>選好日期與評分後即可儲存。</div>'}
function renderCompare(){const q=$('compareSearch').value.trim().toLowerCase();const rows=[];db.projects.forEach(p=>p.units.forEach(u=>{const vs=db.visits.filter(v=>v.projectId===p.id&&v.unitId===u.id);if(!vs.length)return;const avgs=Object.fromEntries(CATS.map(([k])=>{const values=vs.map(v=>+v.scores?.[k]||0).filter(n=>n>0);return [k,values.length?values.reduce((a,b)=>a+b,0)/values.length:0]}));const rated=CATS.map(([k])=>avgs[k]).filter(n=>n>0);const total=rated.length?rated.reduce((a,b)=>a+b,0)/rated.length:0;const text=`${p.name} ${u.name} ${p.address}`.toLowerCase();if(text.includes(q))rows.push({p,u,vs,avgs,total,latest:vs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]})}));rows.sort((a,b)=>b.total-a.total);$('compareEmpty').style.display=rows.length?'none':'block';$('compareTable').hidden=compareMode!=='rank';$('radarView').hidden=compareMode!=='radar';$('rankTab').classList.toggle('selected',compareMode==='rank');$('radarTab').classList.toggle('selected',compareMode==='radar');$('compareTable').innerHTML=rows.length?`<table><thead><tr><th>排名</th><th>建案／戶別</th><th>開價</th><th>參考成交</th><th>平均總分</th>${CATS.map(([,l])=>`<th>${l}</th>`).join('')}<th>看房次數</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>#${i+1}</td><td><b>${esc(r.p.name)}</b><div class="subtle">${esc(r.u.name)} · ${esc(r.p.address||'')}</div></td><td>${esc(r.u.price||'—')}</td><td>${esc(r.u.reference||'—')}</td><td class="score">${r.total.toFixed(1)}</td>${CATS.map(([k])=>`<td>${r.avgs[k]?r.avgs[k].toFixed(1):'—'}</td>`).join('')}<td>${r.vs.length}</td></tr>`).join('')}</tbody></table>`:'';if(!rows.length){$('radarView').innerHTML='';return}const colors=['#285c49','#df8a4b','#5379a5','#a85862','#8a6caa','#9b8a3c','#41918a','#bd6e9a'];const cx=335,cy=225,R=150,n=CATS.length,point=(axis,scale)=>{const angle=-Math.PI/2+2*Math.PI*axis/n;return [cx+Math.cos(angle)*R*scale,cy+Math.sin(angle)*R*scale]};let svg=`<svg viewBox="0 0 680 470" role="img" aria-label="各戶別八項評分雷達圖">`;for(let level=1;level<=5;level++){const pts=CATS.map((_,i)=>point(i,level/5).join(',')).join(' ');svg+=`<polygon points="${pts}" fill="none" stroke="#dfe4dc" stroke-width="1"/>`}CATS.forEach(([,label],i)=>{const [x,y]=point(i,1);const [tx,ty]=point(i,1.17);svg+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#dfe4dc"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#526057">${label}</text>`});rows.forEach((r,ri)=>{const color=colors[ri%colors.length],pts=CATS.map(([k],i)=>point(i,r.avgs[k]/5).join(',')).join(' ');svg+=`<polygon points="${pts}" fill="${color}" fill-opacity=".10" stroke="${color}" stroke-width="2"/>`;CATS.forEach(([k],i)=>{const [x,y]=point(i,r.avgs[k]/5);if(r.avgs[k])svg+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${color}"/>`})});svg+='</svg>';const legend=rows.map((r,i)=>`<span class="legend-item"><i class="legend-dot" style="background:${colors[i%colors.length]}"></i>${esc(r.p.name)} ${esc(r.u.name)}（${r.total.toFixed(1)}）</span>`).join('');$('radarView').innerHTML=`<div class="radar-wrap">${svg}<div class="radar-legend">${legend}</div></div>`}function render(){renderProjects();renderSelected();renderCompare()}
function showPage(page){activePage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('.nav-btn,.nav-tab').forEach(el=>el.classList.toggle('active',el.dataset.page===page));const titles={projects:['建案資料','先整理建案資訊，再在同一建案下建立看房戶別。'],rating:['看房評分','選擇建案與戶別，記下現場感受並評估各項條件。'],compare:['總覽比較','用總分、價格與各項評分，快速比較看過的戶別。']};$('heroTitle').textContent=titles[page][0];$('heroDesc').textContent=titles[page][1];window.scrollTo({top:0,behavior:'smooth'})}
function resetProject(){ $('projectForm').reset();$('projectEdit').value='';$('projectFormTitle').textContent='新增建案';$('projectSave').textContent='新增建案';$('projectCancel').hidden=true}function resetVisit(){ $('visitForm').reset();$('visitEdit').value='';$('visitSave').textContent='儲存看房紀錄';$('visitCancel').hidden=true;$('vDate').value=new Date().toISOString().slice(0,10);CATS.forEach(([k])=>{$('score-'+k).value='0';document.querySelectorAll(`[data-stars="${k}"] button`).forEach(b=>b.classList.remove('on'))});updateAverage()}function updateAverage(){const vals=CATS.map(([k])=>+($('score-'+k)?.value||0)).filter(x=>x);$('scoreAverage').textContent=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—'}
function addUnit(pid,existing){const p=project(pid);if(!p)return;const name=prompt(existing?'戶別名稱':'戶別名稱（如 A2 戶、12 樓）',existing?.name||'');if(name===null)return;const clean=name.trim();if(!clean)return toast('請輸入戶別名稱');const layout=prompt('格局（選填）',existing?.layout||'')??existing?.layout??'';const area=prompt('坪數（選填）',existing?.area||'')??existing?.area??'';const price=prompt('開價／租金（選填）',existing?.price||'')??existing?.price??'';const reference=prompt('實登／參考成交價（選填）',existing?.reference||'')??existing?.reference??'';if(existing)Object.assign(existing,{name:clean,layout,area,price,reference});else p.units.push({id:uid(),name:clean,layout,area,price,reference});save();toast(existing?'戶別已更新':'戶別已新增')}
document.querySelectorAll('.nav-btn,.nav-tab').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('rankTab').onclick=()=>{compareMode='rank';renderCompare()};$('radarTab').onclick=()=>{compareMode='radar';renderCompare()};$('scoreFields').innerHTML=CATS.map(([k,label,help])=>`<div class="score-field"><label>${label}</label><div class="score-stars" data-stars="${k}" role="radiogroup" aria-label="${label}評分">${[1,2,3,4,5].map(n=>`<button type="button" data-value="${n}" aria-label="${n} 星">★</button>`).join('')}</div><select id="score-${k}" aria-label="${label}" hidden><option value="0">未評分</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} 分</option>`).join('')}</select><div class="score-help">${help}</div></div>`).join('');document.querySelectorAll('.score-stars').forEach(group=>group.onclick=e=>{const n=e.target.dataset.value;if(!n)return;const sel=$('score-'+group.dataset.stars);sel.value=n;group.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.value<=+n));updateAverage()});$('projectForm').onsubmit=e=>{e.preventDefault();const id=$('projectEdit').value,data={name:$('pName').value.trim(),address:$('pAddress').value.trim(),builder:$('pBuilder').value.trim(),contact:$('pContact').value.trim(),notes:$('pNotes').value.trim()};if(id){Object.assign(project(id),data);toast('建案資料已更新')}else{db.projects.push({id:uid(),...data,units:[]});toast('建案已新增')}save();resetProject()};$('projectCancel').onclick=resetProject;
$('projects').onclick=e=>{const id=e.target.dataset.projectEdit;if(id){const p=project(id);$('projectEdit').value=id;$('pName').value=p.name;$('pAddress').value=p.address||'';$('pBuilder').value=p.builder||'';$('pContact').value=p.contact||'';$('pNotes').value=p.notes||'';$('projectFormTitle').textContent='編輯建案';$('projectSave').textContent='儲存變更';$('projectCancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'});return}const del=e.target.dataset.projectDelete;if(del){const p=project(del);if(confirm(`刪除「${p.name}」及其戶別與看房紀錄？`)){db.projects=db.projects.filter(x=>x.id!==del);db.visits=db.visits.filter(v=>v.projectId!==del);save();toast('建案已刪除')}return}if(e.target.dataset.unitAdd){addUnit(e.target.dataset.unitAdd);return}if(e.target.dataset.unitEdit){const [pid,uid0]=e.target.dataset.unitEdit.split('|');addUnit(pid,unit(pid,uid0));return}if(e.target.dataset.unitDelete){const [pid,uid0]=e.target.dataset.unitDelete.split('|');const u=unit(pid,uid0);if(confirm(`刪除戶別「${u.name}」及相關看房紀錄？`)){project(pid).units=project(pid).units.filter(x=>x.id!==uid0);db.visits=db.visits.filter(v=>v.unitId!==uid0);save();toast('戶別已刪除')}}};
$('rProject').onchange=()=>{renderUnits();resetVisit()};$('rUnit').onchange=()=>{renderSelected();resetVisit()};$('visitForm').onsubmit=e=>{e.preventDefault();const p=project($('rProject').value),u=unit(p?.id,$('rUnit').value);if(!u)return toast('請先選擇看房戶別');const old=$('visitEdit').value;const item={id:old||uid(),projectId:p.id,unitId:u.id,date:$('vDate').value,price:$('vPrice').value.trim(),scores:Object.fromEntries(CATS.map(([k])=>[k,+$('score-'+k).value||0])),pros:$('vPros').value.trim(),cons:$('vCons').value.trim(),notes:$('vNotes').value.trim()};if(old)db.visits=db.visits.map(v=>v.id===old?item:v);else db.visits.push(item);save();resetVisit();toast(old?'看房紀錄已更新':'看房紀錄已儲存')};$('visitCancel').onclick=resetVisit;$('history').onclick=e=>{const id=e.target.dataset.visitEdit;if(id){const v=db.visits.find(x=>x.id===id);$('visitEdit').value=id;$('vDate').value=v.date;$('vPrice').value=v.price||'';$('vPros').value=v.pros||'';$('vCons').value=v.cons||'';$('vNotes').value=v.notes||'';CATS.forEach(([k])=>{const n=+v.scores?.[k]||0;$('score-'+k).value=n;document.querySelectorAll(`[data-stars="${k}"] button`).forEach(b=>b.classList.toggle('on',+b.dataset.value<=n))});updateAverage();$('visitSave').textContent='更新看房紀錄';$('visitCancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'});return}const del=e.target.dataset.visitDelete;if(del&&confirm('刪除這筆看房紀錄？')){db.visits=db.visits.filter(v=>v.id!==del);save();toast('看房紀錄已刪除')}};$('compareSearch').oninput=renderCompare;
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('jsonBtn').onclick=()=>{if(!db.projects.length)return toast('目前沒有資料可備份');download(`看房筆記備份_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(db,null,2),'application/json');toast('JSON 備份已匯出')};$('csvBtn').onclick=()=>{if(!db.projects.length)return toast('目前沒有資料可匯出');const rows=[['建案','地址','戶別','格局','坪數','開價','參考成交','看房日期','現場價格','平均總分',...CATS.map(([,l])=>l),'喜歡的地方','需要考慮','現場紀錄']];db.projects.forEach(p=>p.units.forEach(u=>{const vs=db.visits.filter(v=>v.projectId===p.id&&v.unitId===u.id);if(!vs.length)rows.push([p.name,p.address,u.name,u.layout,u.area,u.price,u.reference,'','','','','','','','','','','']);vs.forEach(v=>rows.push([p.name,p.address,u.name,u.layout,u.area,u.price,u.reference,v.date,v.price,average(v).toFixed(1),...CATS.map(([k])=>v.scores?.[k]||''),v.pros,v.cons,v.notes]))}));const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`看房比較_${new Date().toISOString().slice(0,10)}.csv`,csv,'text/csv;charset=utf-8');toast('CSV 已匯出')};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!x||!Array.isArray(x.projects)||!Array.isArray(x.visits)||x.projects.some(p=>!Array.isArray(p.units)))throw Error();db=confirm(`備份檔有 ${x.projects.length} 個建案、${x.visits.length} 筆看房紀錄。\n按「確定」取代目前資料；按「取消」合併。`)?x:{projects:[...db.projects,...x.projects],visits:[...db.visits,...x.visits]};save();toast('備份資料已匯入')}catch{alert('匯入失敗，請選擇本網站匯出的有效 JSON 備份檔。')}e.target.value=''};
load();$('vDate').value=new Date().toISOString().slice(0,10);render();updateAverage();})();
</script></body></html>
